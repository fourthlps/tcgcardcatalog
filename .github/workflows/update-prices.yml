name: Update One Piece TCG prices

on:
  schedule:
    - cron: '0 18 * * *'   # ทุกวัน 18:00 UTC = ตี 1 เวลาไทย (เที่ยงคืน + 1)
  workflow_dispatch:        # ปุ่มกดรันเองได้ทันทีจากแท็บ Actions
    inputs:
      dry_run:
        description: 'Dry-run price history ingest (true = validate only, do not append rows)'
        type: boolean
        default: true
        required: false

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest prices
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
          # Manual runs respect the dry_run input checkbox.
          # Scheduled runs default to DRY_RUN=false (real write) because
          # the pipeline has been manually verified and is now in production.
          # The boolean false / 'false' edge-case is handled via != 'workflow_dispatch'
          # to avoid the classic &&/|| ternary pitfall (see previous comment history).
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' && 'false' || inputs.dry_run }}
        run: python scripts/update_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "price-update-bot"
          git config user.email "actions@github.com"
          git add onepiece-catalog/one_piece_OP01-OP16_with_prices.json
          git add onepiece-catalog/data/
          git diff --staged --quiet || git commit -m "Auto-update prices $(date +'%Y-%m-%d')"
          git push

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error title=Price Update Failed::Daily price update failed on $(date +'%Y-%m-%d'). Check the Fetch latest prices step for details. Price history may have a gap for today."
