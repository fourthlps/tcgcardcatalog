name: Update One Piece TCG prices

on:
  schedule:
    - cron: '0 18 * * *'   # ทุกวัน 18:00 UTC = ตี 1 เวลาไทย (เที่ยงคืน + 1)
  workflow_dispatch:        # ปุ่มกดรันเองได้ทันทีจากแท็บ Actions
    inputs:
      dry_run:
        description: 'Dry-run price history ingest (true = validate only, do not append rows)'
        type: boolean
        default: true
        required: false
      jp_dry_run:
        description: 'Dry-run JP price fetch (true = fetch+match+report only, do not modify card-markets.json)'
        type: boolean
        default: false
        required: false
      jp_sets:
        description: 'Staged validation: comma-separated Yuyu set slugs (e.g. op01 or op05,st01,eb01). Empty = all sets.'
        type: string
        default: ''
        required: false
      jp_extra_slugs:
        description: 'Investigation only: extra Yuyu slugs to add to the fetch universe (e.g. op14). Default off; scheduled runs never set this.'
        type: string
        default: ''
        required: false

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch latest prices
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' && 'false' || inputs.dry_run }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/update_prices.py

      - name: Fetch JP prices (Yuyu-Tei via relay — KI-40)
        env:
          JP_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.jp_dry_run || 'false' }}
          JP_SETS: ${{ github.event_name == 'workflow_dispatch' && inputs.jp_sets || '' }}
          JP_EXTRA_SLUGS: ${{ github.event_name == 'workflow_dispatch' && inputs.jp_extra_slugs || '' }}
          JP_RELAY_URL: ${{ secrets.JP_RELAY_URL }}
          JP_RELAY_SECRET: ${{ secrets.JP_RELAY_SECRET }}
        run: python scripts/update_jp_prices.py

      - name: Append JP price history snapshot
        run: python scripts/append_jp_history.py

      - name: Compute JP 7-day trends
        run: python scripts/compute_jp_trends.py

      - name: JP sentinel — record freshness/coverage into status.json
        env:
          JP_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.jp_dry_run || 'false' }}
          JP_SETS: ${{ github.event_name == 'workflow_dispatch' && inputs.jp_sets || '' }}
        run: python scripts/jp_sentinel.py

      - name: Commit and push if changed
        run: |
          git config user.name "price-update-bot"
          git config user.email "actions@github.com"
          git add onepiece-catalog/one_piece_OP01-OP16_with_prices.json
          git add onepiece-catalog/card-markets.json
          git add onepiece-catalog/data/
          git diff --staged --quiet || git commit -m "Auto-update prices $(date +'%Y-%m-%d')"
          git push

      # After the push on purpose: a red sentinel must not cost the day's EN
      # prices or the freshly written jp status block.
      - name: JP sentinel — fail the run on stale/no-result JP data
        run: python scripts/jp_sentinel.py --enforce

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error title=Price Update Failed::Daily price update failed on $(date +'%Y-%m-%d'). Check the logs for details."