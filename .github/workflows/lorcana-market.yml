name: Update Lorcana prices

# Independent from the One Piece pipeline (update-prices.yml @ 18:00 UTC):
# a Lorcana failure can never fail One Piece and vice versa.
on:
  schedule:
    - cron: '30 19 * * *'   # ทุกวัน 19:30 UTC = 02:30 เวลาไทย (หลังรอบ One Piece 1.5 ชม.)
  workflow_dispatch:         # ปุ่มกดรันเองได้ทันทีจากแท็บ Actions

permissions:
  contents: write

jobs:
  update-lorcana-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest Lorcana prices (TCGCSV / TCGplayer mirror)
        working-directory: onepiece-catalog
        run: python ../scripts/update_lorcana_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "price-update-bot"
          git config user.email "actions@github.com"
          git add onepiece-catalog/data/lorcana/prices.json
          git add onepiece-catalog/data/lorcana/products.json
          git diff --staged --quiet || git commit -m "Auto-update Lorcana prices $(date +'%Y-%m-%d')"
          git push

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error title=Lorcana Price Update Failed::Daily Lorcana price update failed on $(date +'%Y-%m-%d'). One Piece pipeline is unaffected. Check logs."
