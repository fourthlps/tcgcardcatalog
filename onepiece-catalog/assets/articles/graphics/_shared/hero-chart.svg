<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" preserveAspectRatio="xMaxYMid slice" role="presentation">
  <!-- Voyage Log ORIGINAL hero artwork: a navigator's chart.
       Compass rose, rhumb lines, plotted route and sea bands. Drawn geometry
       only. No franchise, official, or character artwork of any kind; this
       evokes the seafaring genre, never the property. Gradient stops mirror
       the foil token in assets/articles/article.css; keep them in step. -->
  <defs>
    <linearGradient id="hf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="hglow" cx=".78" cy=".42" r=".55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".9"/>
    </linearGradient>
    <mask id="hmask">
      <rect width="1200" height="460" fill="url(#hfade)"/>
    </mask>
  </defs>

  <rect width="1200" height="460" fill="url(#hglow)"/>

  <g mask="url(#hmask)">
    <!-- chart grid -->
    <g stroke="#2563eb" stroke-opacity=".16" stroke-width="1">
      <path d="M0 60 H1200 M0 130 H1200 M0 200 H1200 M0 270 H1200 M0 340 H1200 M0 410 H1200"/>
      <path d="M80 0 V460 M180 0 V460 M280 0 V460 M380 0 V460 M480 0 V460 M580 0 V460 M680 0 V460 M780 0 V460 M880 0 V460 M980 0 V460 M1080 0 V460"/>
    </g>

    <!-- compass rose -->
    <g transform="translate(900,215)">
      <circle r="168" fill="none" stroke="url(#hf)" stroke-opacity=".5" stroke-width="2.5"/>
      <circle r="128" fill="none" stroke="url(#hf)" stroke-opacity=".32" stroke-width="2"/>
      <circle r="52"  fill="none" stroke="url(#hf)" stroke-opacity=".28" stroke-width="1.6"/>
      <!-- rhumb lines -->
      <g stroke="url(#hf)" stroke-opacity=".22" stroke-width="1.2">
        <path d="M-168 0 H168 M0 -168 V168"/>
        <path d="M-119 -119 L119 119 M-119 119 L119 -119"/>
      </g>
      <!-- cardinal star -->
      <path d="M0 -160 L26 -26 L0 0 L-26 -26 Z" fill="url(#hf)" fill-opacity=".62"/>
      <path d="M0 160 L26 26 L0 0 L-26 26 Z" fill="url(#hf)" fill-opacity=".38"/>
      <path d="M-160 0 L-26 26 L0 0 L-26 -26 Z" fill="url(#hf)" fill-opacity=".3"/>
      <path d="M160 0 L26 26 L0 0 L26 -26 Z" fill="url(#hf)" fill-opacity=".3"/>
      <!-- tick marks -->
      <g stroke="url(#hf)" stroke-opacity=".45" stroke-width="2.4" stroke-linecap="round">
        <path d="M0 -182 V-172 M0 172 V182 M-182 0 H-172 M172 0 H182"/>
      </g>
    </g>

    <!-- plotted route with waypoints -->
    <path d="M120 372 C 300 336, 380 250, 520 232 S 760 246, 872 206"
          fill="none" stroke="url(#hf)" stroke-opacity=".5" stroke-width="2.6"
          stroke-linecap="round" stroke-dasharray="10 11"/>
    <g fill="url(#hf)" fill-opacity=".62">
      <rect x="113" y="365" width="14" height="14" rx="3" transform="rotate(45 120 372)"/>
      <rect x="513" y="225" width="14" height="14" rx="3" transform="rotate(45 520 232)"/>
      <rect x="865" y="199" width="14" height="14" rx="3" transform="rotate(45 872 206)"/>
    </g>

    <!-- sea bands -->
    <g stroke="url(#hf)" stroke-opacity=".3" stroke-width="2.4" stroke-linecap="round" fill="none">
      <path d="M60 424 q26 -20 52 0 t52 0 t52 0 t52 0"/>
      <path d="M60 448 q26 -20 52 0 t52 0 t52 0 t52 0"/>
      <path d="M328 436 q26 -20 52 0 t52 0 t52 0"/>
    </g>
  </g>
</svg>
