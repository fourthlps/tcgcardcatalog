<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 392" width="400" height="392" role="img" aria-labelledby="sd-t">
  <title id="sd-t">สตาร์ทเตอร์เด็ค 1 กล่อง คือจุดเริ่มต้นที่พอแล้วสำหรับมือใหม่</title>
  <!-- Voyage Log ORIGINAL editorial diagram. Geometry and type only.
       No official artwork, product photo, box art, or card scan is used;
       the box glyph is drawn geometry, not a depiction of a real package.
       Every claim is quoted from the approved article's own
       "อยากเริ่มเล่น ต้องซื้ออะไรบ้าง" section. Nothing is inferred. -->
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <style>
    .p    { fill:#ffffff; stroke:#e6eaf3; stroke-width:1.5; }
    .main { font-family:'Segoe UI','Noto Sans Thai','Leelawadee UI',system-ui,sans-serif;
            font-size:19px; font-weight:700; fill:#101728; }
    .hdr  { font-family:'Segoe UI','Noto Sans Thai','Leelawadee UI',system-ui,sans-serif;
            font-size:17px; font-weight:700; fill:#101728; }
    .sub  { font-family:'Segoe UI','Noto Sans Thai','Leelawadee UI',system-ui,sans-serif;
            font-size:14.5px; fill:#5b6478; }
    .ico  { fill:none; stroke:url(#f); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
  </style>

  <!-- 1 · what it is: one box, and it already contains the whole game -->
  <rect class="p" x="1" y="1" width="398" height="112" rx="15"/>
  <rect x="1" y="1" width="5" height="112" fill="url(#f)"/>
  <rect class="ico" x="30" y="33" width="48" height="48" rx="8"/>
  <path class="ico" d="M30 49 H78"/>
  <path d="M54 60 L58 70 L54 80 L50 70 Z" fill="url(#f)"/>
  <text class="main" x="98" y="52">สตาร์ทเตอร์เด็ค 1 กล่อง</text>
  <text class="sub"  x="98" y="78">ครบในกล่อง: ลีดเดอร์ · เด็คหลัก · การ์ดด้ง!!</text>

  <!-- 2 · why a beginner starts here rather than with booster packs -->
  <rect class="p" x="1" y="128" width="398" height="140" rx="15"/>
  <rect x="1" y="128" width="5" height="140" fill="url(#f)"/>
  <text class="hdr" x="30" y="162">แกะกล่องแล้วเล่นได้เลย</text>
  <path class="ico" d="M32 194 l5 6 l10 -13"/>
  <text class="sub" x="60" y="199">ไม่ต้องซื้อการ์ดแยกทีละใบ</text>
  <path class="ico" d="M32 222 l5 6 l10 -13"/>
  <text class="sub" x="60" y="227">ไม่ต้องนั่งประกอบเด็คเอง</text>
  <path class="ico" d="M32 250 l5 6 l10 -13"/>
  <text class="sub" x="60" y="255">ไม่ต้องรู้กฎการจัดเด็ค</text>

  <!-- 3 · the only thing the box does not include -->
  <rect class="p" x="1" y="284" width="398" height="100" rx="15"/>
  <rect x="1" y="284" width="5" height="100" fill="url(#f)"/>
  <circle cx="42" cy="323" r="8" fill="url(#f)"/>
  <path d="M28 350 q14 -17 28 0 z" fill="url(#f)"/>
  <circle cx="68" cy="323" r="8" fill="url(#f)" fill-opacity=".45"/>
  <path d="M54 350 q14 -17 28 0 z" fill="url(#f)" fill-opacity=".45"/>
  <text class="main" x="98" y="326">สิ่งเดียวที่ต้องมีเพิ่ม</text>
  <text class="sub"  x="98" y="352">คนเล่นด้วยอีก 1 คน ที่มีเด็คของตัวเอง</text>
</svg>
